<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharelah - Share files and text between devices, no login</title>
<meta name="description" content="Sharelah lets you share files and paste text between your phone and laptop using a code or QR. No login, no account. Delete the session when you are done.">
<meta name="keywords" content="share files between devices, no login file transfer, phone to laptop, QR code file sharing, Sharelah">
<link rel="canonical" href="/">
<meta property="og:title" content="Sharelah - No-login file and text sharing">
<meta property="og:description" content="Connect two devices with a code or QR and share files and text instantly. No account needed.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0f172a">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <h1>Sharelah</h1>
  <p class="muted">Share files and text between your devices. No login, no account.</p>

  <div class="card">
    <h2>Start a new session</h2>
    <button id="create">Create session</button>
  </div>

  <div class="card">
    <h2>Join with a code</h2>
    <div class="row">
      <input type="text" id="code" placeholder="Enter code e.g. K7P2QX" maxlength="6" autocapitalize="characters" autocomplete="off">
      <button id="join">Join</button>
    </div>
    <div class="err" id="err"></div>
    <p class="muted">Or scan the QR code shown on the other device with your camera.</p>
  </div>
</div>
<script>
document.getElementById('create').onclick = async () => {
  const r = await fetch('/api/sessions', { method: 'POST' });
  const { code } = await r.json();
  location.href = '/s/' + code;
};
async function join() {
  const code = document.getElementById('code').value.trim().toUpperCase();
  const err = document.getElementById('err');
  if (!code) return;
  const r = await fetch('/api/sessions/' + code);
  const { exists } = await r.json();
  if (exists) location.href = '/s/' + code; else err.textContent = 'Session not found.';
}
document.getElementById('join').onclick = join;
document.getElementById('code').addEventListener('keydown', e => { if (e.key === 'Enter') join(); });
</script>
</body>
</html>
